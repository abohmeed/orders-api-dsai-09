name: deps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Dependency gate (PyPI existence + age)
        run: python tools/deps-gate.py

      - name: uv lock is current
        run: |
          uv lock --check
          uv export --format requirements-txt --hashes | head -n 8

      - name: OSV-Scanner
        uses: google/osv-scanner-action@v2.2.3
        with:
          scan-args: |-
            --recursive
            ./
